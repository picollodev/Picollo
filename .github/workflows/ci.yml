name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Mandatory for Trusted Publishing (OIDC)
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: 0.0.0-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: dotnet build src/Picollo/Picollo.csproj -c Release -p:PackageVersion=$PACKAGE_VERSION

      - name: Test
        run: dotnet test src/Picollo.Tests/Picollo.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/Picollo/Picollo.csproj -c Release --no-build -o ./artifacts -p:PackageVersion=$PACKAGE_VERSION

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'picollodev/picollo'
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
